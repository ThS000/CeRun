<!-- MODAL DE LOGIN / CADASTRO -->
<div class="modalOverlay" id="authModal">
    <div class="modal-caixa">
        <button class="modalClose" id="closeAuthModal" title="Fechar">✕</button>
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Entrar</button>
                <button class="tab-btn" data-tab="cadastro">Cadastrar</button>
            </div>

            <form id="loginForm" class="auth-form">
                <label for="loginEmail">E-mail</label>
                <input type="email" id="loginEmail" required>

                <label for="loginSenha">Senha</label>
                <input type="password" id="loginSenha" required>

                <button type="submit" class="btn-primary">Entrar</button>
                <p class="auth-error" id="loginError"></p>
            </form>

            <form id="cadastroForm" class="auth-form" style="display:none">
                <label for="cadNome">Nome</label>
                <input type="text" id="cadNome" required>

                <label for="cadEmail">E-mail</label>
                <input type="email" id="cadEmail" required>

                <label for="cadSenha">Senha</label>
                <input type="password" id="cadSenha" minlength="4" required>

                <button type="submit" class="btn-primary">Criar conta</button>
                <p class="auth-error" id="cadastroError"></p>
            </form>
        </div>
    </div>
</div>
